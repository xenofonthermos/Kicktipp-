name: Prognose aktualisieren

on:
  schedule:
    # Nur Fallback: GitHub startet geplante Läufe stark verzögert oder gar nicht (gemessen 2026-10-01:
    # 4 von 96 Viertelstunden-Läufen). Der eigentliche Takt entsteht durch Selbst-Anstoß (Kette, s.u.).
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "Intern: vom vorherigen Lauf angestoßen (nicht manuell setzen)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # für den Selbst-Anstoß per workflow_dispatch

# Nie zwei Läufe gleichzeitig (Push-Konflikte); ein neuer Anstoß wartet, bis der laufende fertig ist.
concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Plant den Lauf (src/gate.js, nur OpenLigaDB): sofort rechnen, bis 55/25 Min. vor einem Anstoß
      # warten, nur überbrücken oder nichts tun — und ob danach der nächste Lauf angestoßen wird.
      - name: Vorprüfung (Lauf planen)
        id: gate
        working-directory: app
        # Nur ein von Hand ausgelöster Lauf rechnet sofort; Kettenläufe (chained=true) planen normal.
        run: node src/gate.js ../predictions.json ${{ github.event_name == 'workflow_dispatch' && !inputs.chained && '--manual' || '' }}

      - name: Bis zum Zielzeitpunkt warten
        if: steps.gate.outputs.sleep_seconds != '' && steps.gate.outputs.sleep_seconds != '0'
        run: sleep ${{ steps.gate.outputs.sleep_seconds }}

      - name: Tests ausführen
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        run: npm test

      - name: Prognose berechnen
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node src/predict.js

      - name: Ergebnis veröffentlichen
        if: steps.gate.outputs.run == 'true'
        run: |
          cp app/output/predictions.json predictions.json
          cp app/output/predictions.md predictions.md
          git config user.name "kicktipp-prognose-bot"
          git config user.email "actions@users.noreply.github.com"
          git add predictions.json predictions.md app/data/lineupHistory.json app/data/valueBetTrackRecord.json app/data/tipTrackRecord.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen, nichts zu committen."
          else
            git commit -m "Automatische Prognose-Aktualisierung ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase
            git push
          fi

      # Kette: nur nach erfolgreichem Lauf (sonst keine Endlosschleife bei Fehlern, der stündliche
      # Fallback-Cron versucht es später erneut). GITHUB_TOKEN darf workflow_dispatch auslösen.
      - name: Nächsten Lauf anstoßen
        if: success() && steps.gate.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run predict.yml --ref main --repo "${{ github.repository }}" -f chained=true
